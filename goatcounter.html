<!-- GoatCounter: analítica y contador total -->
<script data-goatcounter="https://fvallejog.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
(() => {
  const iniciarContador = () => {
    let total = document.querySelector('#goatcounter-total');

    if (!total) {
      const pie = document.querySelector('.nav-footer-left, .nav-footer-center, footer');
      if (!pie) return;

      const etiqueta = document.createElement('span');
      etiqueta.className = 'visitor-counter';
      etiqueta.innerHTML = ' · Visitas registradas: <span id="goatcounter-total">…</span>';
      pie.appendChild(etiqueta);
      total = etiqueta.querySelector('#goatcounter-total');
    }

    fetch('https://fvallejog.goatcounter.com/counter/TOTAL.json')
      .then((response) => {
        if (!response.ok) throw new Error('No se pudo consultar el contador');
        return response.json();
      })
      .then((data) => {
        total.textContent = data.count;
      })
      .catch(() => {
        const etiqueta = total.closest('.visitor-counter');
        if (etiqueta) etiqueta.hidden = true;
      });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarContador);
  } else {
    iniciarContador();
  }
})();
</script>
