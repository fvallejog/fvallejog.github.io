name: Actualizar sitio desde la matriz

on:
  push:
    branches: [main]
    paths:
      - "Matriz_contenido_web_Fidel_Vallejo.xlsx"
      - "scripts/generar_contenido_web.py"
      - "*.qmd"
      - "_quarto.yml"
      - "styles.scss"
      - "assets/**"
      - "*.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-sitio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lector de Excel
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generar contenido desde la matriz
        run: python scripts/generar_contenido_web.py

      - name: Renderizar sitio
        run: quarto render

      - name: Publicar archivos compilados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs _generated
          if git diff --cached --quiet; then
            echo "No hay cambios compilados."
          else
            git commit -m "Actualizar sitio desde matriz [skip ci]"
            git push
          fi
